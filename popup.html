<!DOCTYPE html>
<html>
<head>
  <title>Gemini Page Translator</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      width: 320px;
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
      }

      .card {
        background-color: #111827;
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 10px 28px rgba(2, 6, 23, 0.55);
      }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0;
      color: #111827;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header span {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: rgba(15, 118, 110, 0.1);
      color: #0f766e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (prefers-color-scheme: dark) {
      h1 {
        color: #e2e8f0;
      }

      header span {
        background-color: rgba(45, 212, 191, 0.14);
        color: #5eead4;
      }
    }

    section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 12px;
      padding: 14px 16px;
      background-color: rgba(148, 163, 184, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      section {
        background-color: rgba(51, 65, 85, 0.35);
      }
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(15, 23, 42, 0.75);
    }

    @media (prefers-color-scheme: dark) {
      label {
        color: rgba(226, 232, 240, 0.78);
      }
    }

    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      font-size: 0.9rem;
      background-color: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    @media (prefers-color-scheme: dark) {
      input[type="password"],
      input[type="text"],
      select {
        border: 1px solid rgba(148, 163, 184, 0.4);
        background-color: rgba(15, 23, 42, 0.65);
        color: #e2e8f0;
      }
    }

    input[type="password"]:focus,
    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.2);
    }

    .helper {
      font-size: 0.7rem;
      color: rgba(15, 23, 42, 0.55);
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      .helper {
        color: rgba(226, 232, 240, 0.6);
      }
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button.primary,
    button#translateBtn {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      box-shadow: 0 10px 20px rgba(20, 184, 166, 0.25);
    }

    button.primary:hover,
    button#translateBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(20, 184, 166, 0.28);
    }

    button.secondary,
    button#saveSettings {
      background: rgba(15, 118, 110, 0.12);
      color: #0f766e;
    }

    button.secondary:hover,
    button#saveSettings:hover {
      background: rgba(15, 118, 110, 0.18);
    }

    button.ghost {
      background: rgba(15, 23, 42, 0.06);
      color: #1f2937;
    }

    button.ghost:hover {
      transform: none;
      background-color: rgba(15, 23, 42, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      button.ghost {
        background: rgba(148, 163, 184, 0.15);
        color: #e2e8f0;
      }

      button.ghost:hover {
        background: rgba(148, 163, 184, 0.22);
      }
    }

    .token-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.14);
      color: #0f766e;
      font-size: 0.78rem;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      .token-chip {
        background: rgba(45, 212, 191, 0.2);
        color: #5eead4;
      }
    }

    .status {
      font-size: 0.82rem;
      border-radius: 10px;
      padding: 10px 12px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.14);
      color: #15803d;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status.error {
      background: rgba(248, 113, 113, 0.14);
      color: #b91c1c;
      border: 1px solid rgba(248, 113, 113, 0.28);
    }

    @media (prefers-color-scheme: dark) {
      .status.success {
        background: rgba(74, 222, 128, 0.18);
        color: #bbf7d0;
        border-color: rgba(134, 239, 172, 0.35);
      }

      .status.error {
        background: rgba(252, 165, 165, 0.18);
        color: #fecaca;
        border-color: rgba(254, 202, 202, 0.35);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Gemini Page Translator</h1>
      <span>Beta</span>
    </header>

    <section id="settingsSection">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your secure API key" autocomplete="off">
      <p class="helper">Your key is stored locally in Chrome sync storage.</p>

      <label for="modelName">Gemini model (optional)</label>
      <input type="text" id="modelName" placeholder="e.g. gemini-1.5-flash-latest">
      <p class="helper">Leave blank to use the default <code>gemini-pro</code> model.</p>

      <button id="saveSettings" class="secondary">Save settings</button>
    </section>

    <section id="controls">
      <label for="targetLanguage">Translate to</label>
      <select id="targetLanguage">
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="en">English</option>
        <option value="ko">Korean</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
      </select>

      <button id="translateBtn">Translate current page</button>
    </section>

    <section id="tokenSection">
      <div class="token-chip">
        Total tokens used:
        <span id="tokenCount">0</span>
      </div>
      <div class="button-row">
        <button id="resetTokensBtn" class="ghost">Reset usage</button>
        <button id="openShortcuts" class="ghost">Keyboard shortcut</button>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
