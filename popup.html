<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Page Translator</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f6f8fb;
      --surface-variant: rgba(231, 236, 255, 0.92);
      --surface-elevated: rgba(255, 255, 255, 0.82);
      --on-surface: #0f172a;
      --on-surface-variant: #334155;
      --outline: rgba(203, 213, 245, 0.8);
      --primary: #4f46ef;
      --primary-container: rgba(222, 222, 254, 0.88);
      --on-primary: #ffffff;
      --shadow: rgba(79, 70, 239, 0.18);
      --danger: #b91c1c;
      --danger-container: rgba(248, 113, 113, 0.16);
      --success: #15803d;
      --success-container: rgba(74, 222, 128, 0.16);
    }

    
    *, *::before, *::after { box-sizing: border-box; }

@media (prefers-color-scheme: dark) {
      :root {
        --surface: #0f172a;
        --surface-variant: rgba(17, 25, 43, 0.88);
        --surface-elevated: rgba(25, 37, 66, 0.86);
        --on-surface: #e2e8f0;
        --on-surface-variant: #cbd5f5;
        --outline: rgba(100, 116, 139, 0.5);
        --primary: #a5b4fc;
        --primary-container: rgba(60, 73, 121, 0.82);
        --on-primary: #111827;
        --shadow: rgba(0, 0, 0, 0.55);
        --danger-container: rgba(248, 113, 113, 0.24);
        --success-container: rgba(74, 222, 128, 0.24);
      }
    
    *, *::before, *::after { box-sizing: border-box; }

}

    html, body {`n      height: 100%;`n      overflow: auto;`n    }

    body {
      margin: 0;
      padding: 12px;
      width: 320px;
      min-height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      background: radial-gradient(125% 110% at 0% 0%, rgba(255, 255, 255, 0.95) 0%, rgba(226, 232, 255, 0.92) 58%, rgba(211, 221, 255, 0.95) 100%);
      color: var(--on-surface);
      font-family: "Segoe UI", "Roboto", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: radial-gradient(145% 140% at 10% 0%, rgba(32, 43, 74, 0.9) 0%, rgba(14, 20, 40, 0.96) 58%, rgba(10, 15, 32, 0.98) 100%);
      }
    }
    @media (prefers-color-scheme: dark) {
      body {
      margin: 0;
      padding: 12px;
      width: 320px;
      min-height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      background: radial-gradient(125% 110% at 0% 0%, rgba(255, 255, 255, 0.95) 0%, rgba(226, 232, 255, 0.92) 58%, rgba(211, 221, 255, 0.95) 100%);
      color: var(--on-surface);
      font-family: "Segoe UI", "Roboto", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: radial-gradient(145% 140% at 10% 0%, rgba(32, 43, 74, 0.9) 0%, rgba(14, 20, 40, 0.96) 58%, rgba(10, 15, 32, 0.98) 100%);
      }
    }
    .card {
      flex: 1 1 auto;\n      width: 100%;\n      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 18px 18px;
      border-radius: 0;`n      margin-top: 4px;
      background: linear-gradient(170deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.58) 65%, rgba(255, 255, 255, 0.5) 100%), var(--surface-variant);
      box-shadow: 0 24px 46px var(--shadow);
      box-sizing: border-box;
      
    }

    @media (prefers-color-scheme: dark) {
      .card {
        background: linear-gradient(175deg, rgba(47, 63, 105, 0.82) 0%, rgba(17, 25, 45, 0.9) 45%, rgba(12, 19, 36, 0.94) 100%);
        box-shadow: 0 24px 48px rgba(1, 3, 8, 0.65);
      }
    }

    @supports (backdrop-filter: blur(18px)) {
      .card {
        backdrop-filter: blur(18px);
        background: var(--surface-variant);
      }

      @media (prefers-color-scheme: dark) {
        .card {
          background: var(--surface-variant);
        }
      }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--primary-container);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 20px;
      height: 20px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      font-weight: 600;
    `n      line-height: 1.28;`n    }

    .header-title p {
      margin: 0;
      color: var(--on-surface-variant);
      font-size: 0.82rem;
    }

    nav.tab-bar {
      display: flex;
      gap: 6px;
      background: rgba(79, 70, 239, 0.1);
      border-radius: 999px;
      padding: 4px;
    }

    @media (prefers-color-scheme: dark) {
      nav.tab-bar {
        background: rgba(165, 180, 252, 0.12);
      }
    }

    .tab-button {
      flex: 1 1 auto;\n      width: 100%;\n      min-height: 0;
      border: 0;
      background: transparent;
      color: var(--on-surface-variant);
      font-weight: 600;
      padding: 9px 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.86rem;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .tab-button.active {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: 0 10px 20px rgba(79, 70, 239, 0.26);
    }

    .tab-button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .tab-button:active:not(.active) {
      transform: scale(0.98);
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .panel.active {
      display: flex;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--on-surface-variant);
    }

    select,
    input[type="text"],
    input[type="password"] {
      appearance: none;
      border: 1px solid var(--outline);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 0.95rem;
      background: var(--surface-elevated);
      color: var(--on-surface);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    select:focus-visible,
    input:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 239, 0.18);
      background: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      select,
      input[type="text"],
      input[type="password"] {
        background: rgba(21, 32, 55, 0.82);
        border-color: rgba(148, 163, 184, 0.3);
      }

      select:focus-visible,
      input:focus-visible {
        background: rgba(27, 41, 68, 0.92);
      }
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    .md-button {
      flex: 1 1 auto;\n      width: 100%;\n      min-height: 0;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .md-button.filled {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: 0 10px 22px rgba(79, 70, 239, 0.26);
    }

    .md-button.tonal {
      background: rgba(79, 70, 239, 0.12);
      color: var(--primary);
    }

    .md-button.outlined {
      background: transparent;
      color: var(--on-surface-variant);
      border: 1px solid var(--outline);
    }

    .md-button:hover:not([disabled]) {
      transform: translateY(-1px);
    }

    .md-button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .md-button[disabled] {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
      box-shadow: none;
    }

    .usage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      color: var(--on-surface-variant);
    }

    #status {
      font-size: 0.84rem;
      border-radius: 14px;
      padding: 10px 12px;
      display: none;
      transition: opacity 0.2s ease;
    }

    #status.show {
      display: block;
      opacity: 1;
    }

    #status.success {
      background: var(--success-container);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.26);
    }

    #status.info {
      background: rgba(79, 70, 239, 0.12);
      color: var(--primary);
      border: 1px solid rgba(79, 70, 239, 0.28);
    }

.panel .helper {
      font-size: 0.78rem;
      color: var(--on-surface-variant);
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="presentation" focusable="false">
          <path fill="currentColor" d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2z" />
        </svg>
      </div>
      <div class="header-title">
        <h1 data-i18n="heading_title">Gemini Translator</h1>
        <p data-i18n="heading_subtitle">Translate pages with your Gemini API key</p>
      </div>
    </header>

    <nav class="tab-bar" role="tablist" aria-label="Content to view" data-i18n-aria-label="aria_tablist">
      <button class="tab-button active" role="tab" id="tab-translate" aria-controls="translate-panel" data-target="translate-panel" data-i18n="tab_translate">Translate</button>
      <button class="tab-button" role="tab" id="tab-settings" aria-controls="settings-panel" data-target="settings-panel" data-i18n="tab_settings">Settings</button>
      <button class="tab-button" role="tab" id="tab-usage" aria-controls="usage-panel" data-target="usage-panel" data-i18n="tab_usage">Usage</button>
    </nav>

    <section id="translate-panel" class="panel active" role="tabpanel" aria-labelledby="tab-translate">
      <div class="field">
        <label class="field-label" for="targetLanguage" data-i18n="label_translate_to">Translate to</label>
        <select id="targetLanguage" aria-label="Translate to" data-i18n-aria-label="label_translate_to">
          <option value="zh" data-i18n="language_chinese">Chinese</option>
          <option value="ja" data-i18n="language_japanese">Japanese</option>
          <option value="en" data-i18n="language_english">English</option>
          <option value="ko" data-i18n="language_korean">Korean</option>
          <option value="es" data-i18n="language_spanish">Spanish</option>
          <option value="fr" data-i18n="language_french">French</option>
        </select>
      </div>
      <button class="md-button filled" type="button" id="translateBtn" data-i18n="button_translate" data-i18n-busy="button_translating">Translate current page</button>
    </section>

    <section id="settings-panel" class="panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="field">
        <label class="field-label" for="apiKey" data-i18n="label_api_key">Gemini API Key</label>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIxxxx..." data-i18n-placeholder="placeholder_api_key" />
      </div>
      <div class="field">
        <label class="field-label" for="modelName" data-i18n="label_model">Gemini model</label>
        <input id="modelName" type="text" autocomplete="off" spellcheck="false" placeholder="Default: gemini-2.5-flash-lite" data-i18n-placeholder="placeholder_model" />
        <span class="helper" data-i18n="helper_model_optional">Leave blank to use the default Gemini model.</span>
      </div>
      <div class="button-row">
        <button class="md-button filled" type="button" id="saveSettings" data-i18n="button_save" data-i18n-busy="button_saving">Save</button>
        <button class="md-button outlined" type="button" id="openShortcuts" data-i18n="button_shortcuts" data-i18n-title="tooltip_shortcuts">Shortcuts</button>
      </div>
    </section>

    <section id="usage-panel" class="panel" role="tabpanel" aria-labelledby="tab-usage" hidden>
      <div class="usage-row">
        <span data-i18n="label_total_tokens">Total tokens used</span>
        <strong id="tokenCount">0</strong>
      </div>
      <button class="md-button tonal" type="button" id="resetTokensBtn" data-i18n="button_reset_usage" data-i18n-busy="button_resetting">Reset usage</button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script src="popup.js" defer></script>
  <script src="tabs.js" defer></script>
</body>
</html>
